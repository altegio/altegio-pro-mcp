name: Trusted catalog

# Deliberate dispatch on trusted main, after reviewing the exact PR head.
# No pull_request_target or workflow_run consumes untrusted code with secrets.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number
        required: true
      candidate_sha:
        description: Reviewed 40-character PR head SHA
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: catalog-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Pinned-spec validation
    if: github.repository == 'altegio/altegio-pro-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: catalog-spec
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Validate the reviewed PR head
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node trusted/scripts/catalog/candidate.mjs
      - name: Obtain the dedicated status identity
        id: status-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CATALOG_STATUS_APP_ID }}
          private-key: ${{ secrets.CATALOG_STATUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: altegio-pro-mcp
          permission-statuses: write
      - name: Mark the exact revision pending
        env:
          GH_TOKEN: ${{ steps.status-app.outputs.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=pending -f context='Catalog (pinned spec)' \
            -f description='Validating the reviewed pinned specification'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Build the sandbox from trusted dependencies
        run: docker build --file trusted/scripts/catalog/Dockerfile --tag catalog-sandbox trusted
      - name: Fetch and verify the immutable private archive
        timeout-minutes: 2
        env:
          SPEC_ARCHIVE_URL: ${{ secrets.SPEC_ARCHIVE_URL }}
          SPEC_WIF_PROVIDER: ${{ secrets.SPEC_WIF_PROVIDER }}
        run: node trusted/scripts/catalog/fetch-spec.mjs "$RUNNER_TEMP/spec.tar.gz"
      - name: Extract only the pinned input and verify its contents
        timeout-minutes: 2
        run: |
          umask 022
          if ! PYTHONOPTIMIZE=2 python3 trusted/scripts/catalog/extract-spec.py \
            "$RUNNER_TEMP/spec.tar.gz" "$RUNNER_TEMP/private-spec" > "$RUNNER_TEMP/private-extract.log" 2>&1; then
            echo '::error::Private specification archive layout or limits are invalid.'
            exit 1
          fi
          if ! node trusted/scripts/catalog/verify-spec.mjs "$RUNNER_TEMP/private-spec" > "$RUNNER_TEMP/private-verify.log" 2>&1; then
            echo '::error::Private specification is unavailable or differs from the reviewed pin.'
            exit 1
          fi
      - name: Generate without credentials or network and compare on the trusted host
        id: validate
        run: |
          node trusted/scripts/catalog/run-trusted.mjs "$GITHUB_WORKSPACE/candidate" \
            "$RUNNER_TEMP/private-spec" catalog-sandbox "catalog-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Remove private material
        if: always()
        run: |
          docker rm --force "catalog-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          shutil.rmtree(root / 'private-spec', ignore_errors=True)
          for name in ('spec.tar.gz', 'spec.tar.gz.part', 'private-extract.log', 'private-verify.log'):
              (root / name).unlink(missing_ok=True)
          for item in root.glob('catalog-output-*'):
              shutil.rmtree(item, ignore_errors=True)
          PY
      - name: Recheck the head and report the exact reviewed revision
        if: always() && steps.candidate.outputs.sha != '' && steps.status-app.outputs.token != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_STATUS_TOKEN: ${{ steps.status-app.outputs.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          VALIDATION: ${{ steps.validate.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: node trusted/scripts/catalog/candidate.mjs --complete
