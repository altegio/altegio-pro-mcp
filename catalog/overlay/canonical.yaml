# V2 operations that supersede a V1 twin and have no curated tool yet.
#
# Format: catalog/overlay/_schema.yaml. Where V1 and V2 describe the same
# operation, V2 is canonical (product owner, 2026-09-29) and the V1 twin leaves
# the catalog. Twins that share an operationId (`create_tag`, `get_product`,
# `get_service`, `delete_appointment`) are retired by the build without an
# entry; the pairs below have different ids or paths, so they are named here
# (curated survivors are named in existing-tools.yaml). A retired V1 read stays
# reachable only as a fallback route: the executor sends a call to it when the
# call needs a filter only V1 documents — the appointment list (team member and
# change-date filters), the service list (category and team member filters).
# A V1 operation stays listed only when V2 has no operation for its capability
# at all, such as one service category by id.

version: 1

operations:
  # --- tags ------------------------------------------------------------------
  # list_tags and create_tag back the curated appointment-tag tools; their
  # entries live in existing-tools.yaml.
  update_tag:
    domain: tags
    supersedes: [update_tag_by_tag_id]
  delete_tag:
    domain: tags
    supersedes: [delete_tag_by_tag_id]

  # --- services --------------------------------------------------------------
  get_service:
    domain: services
    supersedes: [deprecated_get_service_list_by_id]

  # --- products --------------------------------------------------------------
  list_products:
    domain: products
    tier: core
    facets: [ops, finance]
    tool_name: products_search
    supersedes: [get_products_list]
  # V1 search also matched categories; list_product_categories lists those.
  autocomplete_products:
    domain: products
    tier: core
    facets: [ops, finance]
    tool_name: products_search
    supersedes: [search_product]
  list_product_categories:
    domain: products
    supersedes: [get_product_category_list, get_product_category_list_by_ids]

  # --- custom fields ---------------------------------------------------------
  list_custom_fields:
    domain: custom_fields
    supersedes: [get_custom_field_list]
