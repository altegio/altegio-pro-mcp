# Operations already covered by the hand-written tools in src/tools/definitions/.
#
# Seeded from src/tools/api-mapping.ts (ADR-001 D4: "the existing api-mapping is
# the seed; the generator inverts it"). Recording the taken tool names here keeps
# a future generated pack from claiming a name a hand-written tool already owns,
# and marks these operations as `core` so the executor can point the model at the
# curated tool instead of `api_call_operation`.
#
# Format: catalog/overlay/_schema.yaml. Tiers here are all `core` — every one of
# these tools is in today's always-loaded surface.

version: 1

operations:
  # --- auth ----------------------------------------------------------------
  authorize_user:
    domain: auth
    tier: core
    tool_name: auth_login
    write_allowed: false
    notes: >
      Exchanges email and password for a V1 user token. Deprecated the day V3
      OAuth is live (ADR-001 D6) — never route this through the executor.

  # --- locations -----------------------------------------------------------
  get_location_list:
    domain: locations
    tier: core
    facets: [ops, catalog, finance, marketing, onboarding]
    tool_name: locations_list
    projection: [id, title, city, address, timezone_name]
    write_allowed: false

  # --- appointments --------------------------------------------------------
  get_appointment_list:
    domain: appointments
    tier: core
    facets: [ops]
    tool_name: appointments_list
    param_renames:
      staff_id: team_member_id
    write_allowed: false
  create_appointment:
    domain: appointments
    tier: core
    facets: [ops]
    tool_name: appointments_create
    param_renames:
      staff_id: team_member_id
    write_allowed: false
  update_appointment:
    domain: appointments
    tier: core
    facets: [ops]
    tool_name: appointments_update
    param_renames:
      record_id: appointment_id
      staff_id: team_member_id
    write_allowed: false
  delete_appointment:
    domain: appointments
    tier: core
    facets: [ops]
    tool_name: appointments_delete
    write_allowed: false
    notes: >
      The V2 operation supersedes the V1 one with the same id; the curated tool
      calls it.

  # --- team members --------------------------------------------------------
  list_team_members:
    domain: team_members
    tier: core
    facets: [ops, catalog]
    tool_name: team_members_list
    supersedes: [get_team_member_list]
    write_allowed: false
    notes: >
      Supersedes the unfiltered V1 list in the catalog. The curated tool keeps
      the V1 route because V2 does not return the rating, the online-booking
      visibility or the dismissed flag the tool reports.
  create_team_member_quick:
    domain: team_members
    tier: core
    facets: [catalog, onboarding]
    tool_name: team_members_create
    write_allowed: false
  update_team_member:
    domain: team_members
    tier: core
    facets: [catalog]
    tool_name: team_members_update
    param_renames:
      staff_id: team_member_id
    write_allowed: false
  delete_team_member:
    domain: team_members
    tier: core
    facets: [catalog]
    tool_name: team_members_delete
    param_renames:
      staff_id: team_member_id
    write_allowed: false

  # --- positions -----------------------------------------------------------
  list_positions:
    domain: positions
    tier: core
    facets: [catalog, onboarding]
    tool_name: positions_list
    supersedes: [get_position_list]
    write_allowed: false
    notes: >
      Supersedes the deprecated V1 list; the curated tool calls it.
  create_position:
    domain: positions
    tier: core
    facets: [catalog, onboarding]
    tool_name: positions_create
    supersedes: [create_position_quick]
    write_allowed: false
    notes: >
      Supersedes the deprecated V1 quick create; the curated tool calls it.

  # --- services ------------------------------------------------------------
  get_service_list:
    domain: services
    tier: core
    facets: [ops, catalog]
    tool_name: services_list
    projection: [id, title, category_id, price_min, price_max, duration]
    write_allowed: false
  create_service:
    domain: services
    tier: core
    facets: [catalog, onboarding]
    tool_name: services_create
    write_allowed: false
  deprecated_update_service_by_id:
    domain: services
    tier: core
    facets: [catalog]
    tool_name: services_update
    write_allowed: false
    notes: >
      PUT is replacement-shaped. The curated client reads and merges the
      current service so unchanged fields and team-member links survive.
  delete_service_category:
    domain: services
    tier: core
    facets: [catalog, onboarding]
    tool_name: service_categories_delete
    write_allowed: false
  delete_client:
    domain: clients
    tier: pack
    facets: [ops, onboarding]
    tool_name: clients_delete
    write_allowed: false
  delete_booking_widget:
    domain: online_booking
    tier: core
    facets: [catalog, onboarding]
    tool_name: booking_forms_delete
    write_allowed: false
  remove_user_from_location:
    domain: users
    tier: pack
    facets: [catalog]
    tool_name: locations_remove_user
    write_allowed: false
    notes: Exact user ID is required twice as a destructive safeguard.
  deprecated_get_service_category_list:
    domain: services
    tier: core
    facets: [catalog, onboarding]
    tool_name: service_categories_list
    projection: [id, title, weight]
    write_allowed: false
    notes: >
      Deprecated in the spec but the only service-category listing available to
      this product; keep until a replacement is documented.

  # --- schedule ------------------------------------------------------------
  get_team_member_schedule:
    domain: schedule
    tier: core
    facets: [ops, catalog]
    tool_name: schedules_get
    param_renames:
      staff_id: team_member_id
    write_allowed: false
  set_team_member_schedule:
    domain: schedule
    tier: core
    facets: [catalog, onboarding]
    tool_name: schedules_create
    write_allowed: false
    notes: >
      One PUT backs three tools: schedules_create and schedules_update send
      `schedules_to_set`, schedules_delete sends `schedules_to_delete`.

  # --- location settings ---------------------------------------------------
  get_appointment_calendar_settings:
    domain: settings
    tier: core
    facets: [catalog, onboarding]
    tool_name: settings_get_appointment_calendar
    write_allowed: false
    notes: >
      Appointment-calendar defaults, NOT the location's working hours — real
      working hours come from team member schedules.
  update_appointment_calendar_settings:
    domain: settings
    tier: core
    facets: [catalog, onboarding]
    tool_name: settings_update_appointment_calendar
    write_allowed: false
  get_online_booking_settings:
    domain: online_booking
    tier: core
    facets: [catalog, onboarding]
    tool_name: settings_get_online_booking
    write_allowed: false
  update_online_booking_settings:
    domain: online_booking
    tier: core
    facets: [catalog, onboarding]
    tool_name: settings_update_online_booking
    write_allowed: false
  get_booking_widget_list:
    domain: online_booking
    tier: core
    facets: [catalog, onboarding]
    tool_name: booking_forms_list
    write_allowed: false
  create_booking_widget:
    domain: online_booking
    tier: core
    facets: [catalog, onboarding]
    tool_name: booking_forms_create
    write_allowed: false

  # --- resources -----------------------------------------------------------
  get_resource_list:
    domain: resources
    tier: core
    facets: [catalog]
    tool_name: resources_list
    projection: [id, title]
    write_allowed: false
    notes: Read-only — the V1 API has no create endpoint for resources.
